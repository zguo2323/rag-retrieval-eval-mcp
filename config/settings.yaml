# Modular RAG MCP Server - Configuration

llm:
  provider: "openai"
  model: "gpt-5.6-terra"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: null  # Read from OPENAI_API_KEY
  base_url: ""
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"
  model: "text-embedding-ada-002"
  dimensions: 1536
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: null  # Read from OPENAI_API_KEY
  base_url: ""

vision_llm:
  enabled: true
  provider: "openai"
  model: "gpt-5.6-terra"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: null  # Read from OPENAI_API_KEY
  base_url: ""
  max_image_size: 2048

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 20
  rrf_k: 60
  fusion_min_dense: 10
  fusion_min_sparse: 10
  # Optional semantic retrieval rewrite. Keep disabled until Dev evaluation is frozen.
  llm_query_expansion:
    enabled: false
    mode: "hard_fallback"
    max_route_overlap: 0
    max_tokens: 96
    timeout_seconds: 8.0

rerank:
  enabled: true
  provider: "cross_encoder"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5
  timeout: 10.0
  strategy: "rank_fusion"
  fusion_rank_weight: 0.4
  rank_fusion_k: 60

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  # Optional, deterministic PDF missing-space repair. Keep disabled until a
  # single-document Dev A/B proves stable improvement.
  text_spacing_repair:
    enabled: false
    min_run_length: 20
    max_run_length: 120
    max_repairs: 1000
  chunk_refiner:
    use_llm: true
  metadata_enricher:
    use_llm: true
